name: Draw expired campsite lotteries

on:
  schedule:
    # Hourly, away from GitHub's busy top of the hour. Deadline checks use Alberta time.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview eligible draws without saving any changes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lottery-draw
  cancel-in-progress: false

jobs:
  draw:
    # No runner starts until explicitly enabled. Private repos also require confirmation
    # that the owner has blocked paid Actions usage and accepts using the included allowance.
    if: >-
      vars.LOTTERY_SCHEDULER_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (toJSON(github.event.repository.private) == 'false' || vars.LOTTERY_PRIVATE_FREE_CONFIRMED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tools/lottery-scheduler
    env:
      GOOGLE_CLOUD_PROJECT: campsite-reservation-system
      DRAW_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test scheduler
        run: npm test
      - name: Authenticate to Google Cloud without a private key
        uses: google-github-actions/auth@v3
        with:
          project_id: campsite-reservation-system
          workload_identity_provider: ${{ vars.LOTTERY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LOTTERY_SERVICE_ACCOUNT }}
      - name: Draw eligible lotteries
        shell: bash
        run: |
          if [[ "$DRAW_DRY_RUN" == "true" ]]; then
            npm run dry-run
          else
            npm run draw
          fi
